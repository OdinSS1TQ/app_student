<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Teacher Management</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSRF Token -->
    <script>
        window.csrf_token = "{{ frappe.session.csrf_token }}";
    </script>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- SweetAlert2 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            max-width: 960px;
        }
        .card {
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border: none;
        }
        .table thead {
            background-color: #e9ecef;
        }
        .btn-action {
            margin-right: 5px;
        }
        #alertPlaceholder {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 1050;
            min-width: 300px;
        }
    </style>
</head>
<body>
    <div class="container mt-5 mb-5">
        <h1 class="text-center mb-4 text-primary">Teacher Management</h1>

        <!-- Alert Placeholder -->
        <div id="alertPlaceholder"></div>

        <!-- Teacher Form Card -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                <h4 id="formTitle">Add New Teacher</h4>
            </div>
            <div class="card-body">
                <form id="teacherForm">
                    <input type="hidden" id="teacher_name">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="teacher_id" class="form-label">Teacher ID <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="teacher_id" required>
                        </div>
                        <div class="col-md-6">
                            <label for="full_name" class="form-label">Full Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="full_name" required>
                        </div>
                        <div class="col-md-6">
                            <label for="gender" class="form-label">Gender <span class="text-danger">*</span></label>
                            <select class="form-select" id="gender" required>
                                <option selected disabled value="">Choose...</option>
                                <option>Male</option>
                                <option>Female</option>
                                <option>Other</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="date_of_birth" class="form-label">Date of Birth <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="date_of_birth" required>
                        </div>
                        <div class="col-md-6">
                            <label for="hire_date" class="form-label">Hire Date <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="hire_date" required>
                        </div>
                        <div class="col-md-6">
                            <label for="phone_number" class="form-label">Phone Number <span class="text-danger">*</span></label>
                            <input type="tel" class="form-control" id="phone_number" required pattern="[0-9\+\-\s()]*" title="Enter a valid phone number">
                        </div>
                        <div class="col-md-12">
                            <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                    </div>
                    <div class="mt-4">
                        <button type="submit" id="saveButton" class="btn btn-success me-2">
                            <i class="bi bi-check-circle-fill"></i> Save
                        </button>
                        <button type="button" id="clearButton" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i> Clear
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Teacher List Card -->
        <div class="card">
            <div class="card-header bg-light">
                <h4>Teacher List</h4>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Gender</th>
                                <th>DOB</th>
                                <th>Hire Date</th>
                                <th>Phone</th>
                                <th>Email</th>
                                <th class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="teachersTable">
                            <tr>
                                <td colspan="8" class="text-center">Loading teachers...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        // --- Configuration ---
        const API_BASE_URL = '/api/resource/Teacher';
        axios.defaults.withCredentials = true;
        axios.defaults.headers.common['X-Frappe-CSRF-Token'] = window.csrf_token;

        // --- DOM Elements ---
        const teacherForm = document.getElementById('teacherForm');
        const teachersTable = document.getElementById('teachersTable');
        const teacherNameInput = document.getElementById('teacher_name');
        const teacherIdInput = document.getElementById('teacher_id');
        const fullNameInput = document.getElementById('full_name');
        const genderInput = document.getElementById('gender');
        const dobInput = document.getElementById('date_of_birth');
        const hireDateInput = document.getElementById('hire_date');
        const phoneInput = document.getElementById('phone_number');
        const emailInput = document.getElementById('email');
        const saveButton = document.getElementById('saveButton');
        const clearButton = document.getElementById('clearButton');
        const formTitle = document.getElementById('formTitle');
        const alertPlaceholder = document.getElementById('alertPlaceholder');

        // --- Utility Functions ---
        function showAlert(message, type = 'success') {
            const wrapper = document.createElement('div');
            wrapper.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
            alertPlaceholder.append(wrapper);
            setTimeout(() => wrapper.remove(), 5000);
        }

        function clearForm() {
            teacherForm.reset();
            teacherNameInput.value = '';
            formTitle.textContent = 'Add New Teacher';
            saveButton.innerHTML = '<i class="bi bi-check-circle-fill"></i> Save';
            saveButton.disabled = false;
            teacherIdInput.readOnly = false;
        }

        function setFormState(isEditing, docname = '') {
            if (isEditing) {
                formTitle.textContent = `Edit Teacher (${docname})`;
                saveButton.innerHTML = '<i class="bi bi-pencil-square"></i> Update';
                teacherIdInput.readOnly = true;
            } else {
                clearForm();
            }
        }

        function disableSubmitButton(disabled = true) {
            saveButton.disabled = disabled;
            if (disabled) {
                const currentText = saveButton.textContent.trim();
                saveButton.innerHTML = `
                    <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                    ${currentText}...
                `;
            } else {
                setFormState(!!teacherNameInput.value, teacherNameInput.value);
            }
        }

        // --- API Functions ---
        async function loadTeachers() {
            teachersTable.innerHTML = '<tr><td colspan="8" class="text-center">Loading teachers... <span class="spinner-border spinner-border-sm"></span></td></tr>';
            try {
                const res = await axios.get(API_BASE_URL, {
                    params: {
                        fields: JSON.stringify([
                            "name", "teacher_id", "full_name", "gender", "date_of_birth",
                            "hire_date", "phone_number", "email"
                        ]),
                        limit_page_length: 100
                    }
                });

                if (res.data && Array.isArray(res.data.data)) {
                    const teachers = res.data.data;
                    if (teachers.length === 0) {
                        teachersTable.innerHTML = '<tr><td colspan="8" class="text-center text-muted">No teachers found. Add one using the form above!</td></tr>';
                        return;
                    }

                    let rows = teachers.map(t => {
                        const teacherId = t.teacher_id || 'N/A';
                        const fullName = t.full_name || 'N/A';
                        const gender = t.gender || 'N/A';
                        const dob = t.date_of_birth || 'N/A';
                        const hireDate = t.hire_date || 'N/A';
                        const phone = t.phone_number || 'N/A';
                        const email = t.email || 'N/A';
                        const teacherName = t.name;

                        if (!teacherName) {
                            console.warn("Teacher data missing 'name' property:", t);
                            return '';
                        }

                        return `
                            <tr>
                                <td>${teacherId}</td>
                                <td>${fullName}</td>
                                <td>${gender}</td>
                                <td>${dob}</td>
                                <td>${hireDate}</td>
                                <td>${phone}</td>
                                <td>${email}</td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-warning btn-action" onclick="editTeacher('${teacherName}')" title="Edit">
                                        <i class="bi bi-pencil-fill"></i>
                                    </button>
                                    <button class="btn btn-sm btn-danger btn-action" onclick="deleteTeacher('${teacherName}')" title="Delete">
                                        <i class="bi bi-trash-fill"></i>
                                    </button>
                                </td>
                            </tr>
                        `;
                    }).join('');
                    teachersTable.innerHTML = rows;
                } else {
                    throw new Error("Invalid data format received from API.");
                }
            } catch (err) {
                console.error('Error loading teachers:', err);
                const errorMsg = err.response?.data?.message || err.message || 'Failed to load teachers.';
                teachersTable.innerHTML = `<tr><td colspan="8" class="text-center text-danger">Error: ${errorMsg}</td></tr>`;
                showAlert(`Error loading teachers: ${errorMsg}`, 'danger');
            }
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            disableSubmitButton(true);

            const teacherData = {
                teacher_id: teacherIdInput.value.trim(),
                full_name: fullNameInput.value.trim(),
                gender: genderInput.value,
                date_of_birth: dobInput.value,
                hire_date: hireDateInput.value,
                phone_number: phoneInput.value.trim(),
                email: emailInput.value.trim(),
                doctype: "Teacher"
            };

            const teacherName = teacherNameInput.value;
            let request;
            let successMessage;

            if (teacherName) {
                request = axios.put(`${API_BASE_URL}/${teacherName}`, teacherData);
                successMessage = `Teacher '${teacherData.full_name}' updated successfully!`;
            } else {
                request = axios.post(API_BASE_URL, teacherData);
                successMessage = `Teacher '${teacherData.full_name}' added successfully!`;
            }

            try {
                await request;
                showAlert(successMessage, 'success');
                clearForm();
                loadTeachers();
            } catch (err) {
                console.error('Error saving teacher:', err);
                let errorMsg = 'Failed to save teacher.';
                if (err.response) {
                    errorMsg = err.response.data?.message || err.response.data?._server_messages || JSON.stringify(err.response.data);
                } else {
                    errorMsg = err.message;
                }
                showAlert(`Error: ${errorMsg}`, 'danger');
            } finally {
                disableSubmitButton(false);
            }
        }

        async function editTeacher(name) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            try {
                const res = await axios.get(`${API_BASE_URL}/${name}`);
                const t = res.data.data;
                if (t) {
                    teacherIdInput.value = t.teacher_id || '';
                    fullNameInput.value = t.full_name || '';
                    genderInput.value = t.gender || '';
                    dobInput.value = t.date_of_birth || '';
                    hireDateInput.value = t.hire_date || '';
                    phoneInput.value = t.phone_number || '';
                    emailInput.value = t.email || '';
                    teacherNameInput.value = t.name;

                    setFormState(true, t.name);
                } else {
                    throw new Error("Teacher data not found in response.");
                }
            } catch (err) {
                console.error(`Error fetching teacher ${name} for edit:`, err);
                const errorMsg = err.response?.data?.message || err.message || 'Failed to load teacher data for editing.';
                showAlert(`Error: ${errorMsg}`, 'danger');
            }
        }

        function deleteTeacher(name) {
            Swal.fire({
                title: 'Are you sure?',
                text: "You won't be able to revert this!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Yes, delete it!'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        await axios.delete(`${API_BASE_URL}/${name}`);
                        Swal.fire(
                            'Deleted!',
                            'The teacher record has been deleted.',
                            'success'
                        );
                        if (teacherNameInput.value === name) {
                            clearForm();
                        }
                        loadTeachers();
                    } catch (err) {
                        console.error(`Error deleting teacher ${name}:`, err);
                        const errorMsg = err.response?.data?.message || err.message || 'Failed to delete teacher.';
                        Swal.fire(
                            'Error!',
                            `Could not delete teacher. ${errorMsg}`,
                            'error'
                        );
                    }
                }
            });
        }

        // --- Event Listeners ---
        teacherForm.addEventListener('submit', handleFormSubmit);
        clearButton.addEventListener('click', clearForm);

        // --- Initial Load ---
        document.addEventListener('DOMContentLoaded', loadTeachers);
    </script>
</body>
</html>
