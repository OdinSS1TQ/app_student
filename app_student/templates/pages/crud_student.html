<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student CRUD</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSRF Token -->
    <script>
        window.csrf_token = "{{ frappe.session.csrf_token }}";
    </script>

    <!-- Bootstrap & Axios -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <div class="container mt-5">
        <h1>Student CRUD</h1>

        <form id="studentForm" class="mb-4">
            <div class="form-group">
                <label for="student_id">Student ID</label>
                <input type="text" class="form-control" id="student_id" required>
            </div>
            <div class="form-group">
                <label for="full_name">Full Name</label>
                <input type="text" class="form-control" id="full_name" required>
            </div>
            <div class="form-group">
                <label for="gender">Gender</label>
                <select class="form-control" id="gender" required>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="date_of_birth">Date of Birth</label>
                <input type="date" class="form-control" id="date_of_birth" required>
            </div>
            <div class="form-group">
                <label for="enrollment_date">Enrollment Date</label>
                <input type="date" class="form-control" id="enrollment_date" required>
            </div>
            <div class="form-group">
                <label for="phone_number">Phone Number</label>
                <input type="text" class="form-control" id="phone_number" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <input type="hidden" id="student_name">
            <button type="submit" class="btn btn-primary">Save</button>
        </form>

        <h3>Student List</h3>
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Gender</th>
                    <th>DOB</th>
                    <th>Enroll</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="studentsTable"></tbody>
        </table>
    </div>

    <script>
        axios.defaults.withCredentials = true;
        axios.defaults.headers.common['X-Frappe-CSRF-Token'] = window.csrf_token;

      function loadStudents() {
        axios.get('/api/resource/Student', {
            params: {
                fields: JSON.stringify([
                    "name", "student_id", "full_name", "gender", "date_of_birth",
                    "enrollment_date", "phone_number", "email"
                ])
            }
        })
        .then(res => {
            console.log("API Response:", res); // In toàn bộ phản hồi
            console.log("Response Data:", res.data); // In phần data của phản hồi

            if (res.data && Array.isArray(res.data.data)) {
                const students = res.data.data;
                console.log("Extracted Students:", students); // In mảng sinh viên đã trích xuất

                if (students.length === 0) {
                     document.getElementById('studentsTable').innerHTML = '<tr><td colspan="8">No students found.</td></tr>';
                     return;
                }

                let rows = students.map(s => {
                    // Log all fields for debugging
                    console.log('Student:', s);
                    const studentId = s.student_id || '';
                    const fullName = s.full_name || '';
                    const gender = s.gender || '';
                    const dob = s.date_of_birth || '';
                    const enrollDate = s.enrollment_date || '';
                    const phone = s.phone_number || '';
                    const email = s.email || '';
                    const studentName = s.name;

                     if (!studentName) {
                         console.warn("Student data missing 'name' property:", s);
                     }

                     return `
                        <tr>
                            <td>${studentId}</td>
                            <td>${fullName}</td>
                            <td>${gender}</td>
                            <td>${dob}</td>
                            <td>${enrollDate}</td>
                            <td>${phone}</td>
                            <td>${email}</td>
                            <td>
                                <button class="btn btn-sm btn-warning" ${studentName ? `onclick=\"editStudent('${studentName}')\"` : 'disabled'}>Edit</button>
                                <button class="btn btn-sm btn-danger" ${studentName ? `onclick=\"deleteStudent('${studentName}')\"` : 'disabled'}>Delete</button>
                            </td>
                        </tr>
                    `;
                }).join('');
                document.getElementById('studentsTable').innerHTML = rows;
            } else {
                console.error("Expected res.data.data to be an array, but received:", res.data);
                document.getElementById('studentsTable').innerHTML = '<tr><td colspan="8">Error: Invalid data format received from API.</td></tr>';
            }
        })
        .catch(err => {
            console.error('Error loading students:', err);
            if (err.response) {
                console.error("Error Response Data:", err.response.data);
                console.error("Error Response Status:", err.response.status);
                console.error("Error Response Headers:", err.response.headers);
            } else if (err.request) {
                console.error("Error Request:", err.request);
            } else {
                console.error('Error Message:', err.message);
            }
            document.getElementById('studentsTable').innerHTML = '<tr><td colspan="8">Error loading students. Check console for details.</td></tr>';
        });
}
        document.getElementById('studentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const studentData = {
                student_id: document.getElementById('student_id').value,
                full_name: document.getElementById('full_name').value,
                gender: document.getElementById('gender').value,
                date_of_birth: document.getElementById('date_of_birth').value,
                enrollment_date: document.getElementById('enrollment_date').value,
                phone_number: document.getElementById('phone_number').value,
                email: document.getElementById('email').value,
            };
            const studentName = document.getElementById('student_name').value;
            if (studentName) {
                axios.put(`/api/resource/Student/${studentName}`, studentData).then(() => {
                    this.reset();
                    document.getElementById('student_name').value = '';
                    loadStudents();
                });
            } else {
                axios.post('/api/resource/Student', studentData).then(() => {
                    this.reset();
                    loadStudents();
                });
            }
        });

        function editStudent(name) {
            axios.get(`/api/resource/Student/${name}`)
                .then(res => {
                    const s = res.data.data;
                    document.getElementById('student_id').value = s.student_id;
                    document.getElementById('full_name').value = s.full_name;
                    document.getElementById('gender').value = s.gender;
                    document.getElementById('date_of_birth').value = s.date_of_birth;
                    document.getElementById('enrollment_date').value = s.enrollment_date || '';
                    document.getElementById('phone_number').value = s.phone_number || '';
                    document.getElementById('email').value = s.email || '';
                    document.getElementById('student_name').value = s.name;
                });
        }

        function deleteStudent(name) {
            if (confirm('Are you sure?')) {
                axios.delete(`/api/resource/Student/${name}`).then(() => {
                    loadStudents();
                });
            }
        }

        loadStudents();
    </script>
</body>
</html>
